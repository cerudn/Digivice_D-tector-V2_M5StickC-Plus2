name: Convert Unity Assets and Generate Mapping

on:
  workflow_dispatch:
    inputs:
      unity_ref:
        description: 'Unity repository ref (branch/tag/commit)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  generate-mapping:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout firmware repo
      uses: actions/checkout@v4
      with:
        path: firmware
        fetch-depth: 0
    
    - name: Checkout Unity repository
      id: unity_checkout
      uses: actions/checkout@v4
      with:
        repository: cerudn/Digivice_D-tector-V2_Unity-
        ref: ${{ inputs.unity_ref || 'main' }}
        token: ${{ github.token }}
        path: unity_source
    
    - name: Get Unity revision
      id: unity_rev
      run: |
        cd unity_source
        echo "revision=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "Unity revision: $(git rev-parse HEAD)"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pillow pyyaml numpy
    
    - name: Run asset mapping tool
      id: mapping
      working-directory: firmware
      run: |
        echo "=== Running Asset Mapping Tool ==="
        python tools/convert_assets/build_asset_manifest.py \
          --unity-root ../unity_source \
          --assets-dir assets \
          --output assets/asset_manifest.json \
          --report Docs/ASSET_MAPPING.md
        
        echo ""
        echo "=== MAPPING STATISTICS ==="
        python -c "
        import json
        with open('assets/asset_manifest.json') as f:
            manifest = json.load(f)
        stats = manifest['statistics']
        print(f'TOTAL_GENERATED: {stats[\"total_generated\"]}')
        print(f'RAW_DISCOVERED: {stats[\"raw_discovered\"]}')
        print(f'ASSET_MATCHED: {stats[\"asset_matched\"]}')
        print(f'SEMANTICALLY_MAPPED: {stats[\"semantically_mapped\"]}')
        print(f'UNMATCHED: {stats[\"unmatched\"]}')
        print(f'AMBIGUOUS: {stats[\"ambiguous\"]}')
        print(f'MISSING_METADATA: {stats[\"missing_metadata\"]}')
        "
    
    - name: Run unit tests
      working-directory: firmware/tools/convert_assets
      run: |
        echo "=== Running Unit Tests ==="
        python -m pytest test_build_manifest.py -v 2>/dev/null || python test_build_manifest.py
    
    - name: Validate manifest
      working-directory: firmware
      run: |
        echo "=== Validating Manifest ==="
        python -c "
        import json
        import sys
        
        with open('assets/asset_manifest.json') as f:
            manifest = json.load(f)
        
        stats = manifest['statistics']
        
        # Validate JSON structure
        assert 'mapping' in manifest, 'Missing mapping array'
        assert 'statistics' in manifest, 'Missing statistics'
        
        # Validate counts
        total_in_mapping = len(manifest['mapping'])
        total_in_stats = stats['total_generated']
        
        if total_in_mapping != total_in_stats:
            print(f'ERROR: mapping length ({total_in_mapping}) != statistics.total_generated ({total_in_stats})')
            sys.exit(1)
        
        # Check for placeholders
        if 'placeholder' in json.dumps(manifest).lower():
            print('ERROR: manifest contains placeholder text')
            sys.exit(1)
        
        print('Manifest validation: PASS')
        "
    
    - name: Print sample mappings
      working-directory: firmware
      run: |
        echo "=== SAMPLE MAPPINGS ==="
        python -c "
        import json
        
        with open('assets/asset_manifest.json') as f:
            manifest = json.load(f)
        
        print('=== SAMPLE MAPPINGS ===')
        for i, entry in enumerate(manifest['mapping'][:10]):
            print(f'{i+1}. {entry[\"generated_symbol\"]}')
            print(f'   File: {entry[\"generated_file\"]}')
            if entry.get('source'):
                src = entry['source']
                print(f'   Unity: {src.get(\"png\", \"?\")}')
                print(f'   Sprite: {src.get(\"sprite_name\", \"?\")}')
                if src.get('rect'):
                    r = src['rect']
                    print(f'   Rect: ({r.get(\"x\",\"?\")},{r.get(\"y\",\"?\")}) {r.get(\"width\",\"?\")}x{r.get(\"height\",\"?\")}')
            print(f'   Status: {entry[\"identity\"][\"asset_match\"]}')
            print()
        "
    
    - name: Prepare for commit
      working-directory: firmware
      run: |
        echo "=== Git Status ==="
        git status
        echo ""
        echo "=== Current Branch ==="
        git branch --show-current || echo "DETACHED HEAD"
        echo ""
        echo "=== HEAD ==="
        git rev-parse HEAD
        
        # Ensure we're on main branch for push
        git checkout main 2>/dev/null || git checkout -b main
    
    - name: Commit and push results
      working-directory: firmware
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        echo "=== Files to commit ==="
        git status --porcelain
        
        git add assets/asset_manifest.json Docs/ASSET_MAPPING.md
        
        if ! git diff --cached --quiet; then
          git commit -m "Generate real Unity asset mapping (Unity revision: ${{ steps.unity_rev.outputs.revision }})"
          git push
        else
          echo "No changes to commit"
        fi
