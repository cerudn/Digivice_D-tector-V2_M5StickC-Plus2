name: Convert Unity Assets to ESP32

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regeneration of all assets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  UNITY_REPO: 'cerudn/Digivice_D-tector-V2_Unity-'
  FIRMWARE_REPO: 'cerudn/Digivice_D-tector-V2_M5StickC-Plus2'

jobs:
  convert-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v4
        with:
          path: firmware

      - name: Checkout Unity repository (public)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UNITY_REPO }}
          path: unity-source
          fetch-depth: 1
        continue-on-error: true
        id: checkout_public

      - name: Checkout Unity repository (private with token)
        if: steps.checkout_public.outcome == 'failure' || steps.checkout_public.conclusion == 'failure'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UNITY_REPO }}
          path: unity-source
          fetch-depth: 1
          token: ${{ secrets.UNITY_REPO_TOKEN }}
        id: checkout_private

      - name: Validate Unity repository checkout
        run: |
          cd unity-source
          if [ ! -f "Assets/Sprites/characters.png" ]; then
            echo "ERROR: characters.png not found in Unity repository"
            exit 1
          fi
          if [ ! -f "Assets/Sprites/characters.png.meta" ]; then
            echo "ERROR: characters.png.meta not found in Unity repository"
            exit 1
          fi
          if [ ! -f "Assets/Sprites/animations.png" ]; then
            echo "ERROR: animations.png not found in Unity repository"
            exit 1
          fi
          if [ ! -f "Assets/Sprites/animations.png.meta" ]; then
            echo "ERROR: animations.png.meta not found in Unity repository"
            exit 1
          fi
          echo "Unity assets validated successfully"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Inspect Unity assets and generate report
        run: |
          cd firmware
          python tools/convert_assets/inspect_unity_assets.py \
            --unity-root ../unity-source \
            --output asset-report.json
          cat asset-report.json

      - name: Convert assets to RGB565
        run: |
          cd firmware
          python tools/convert_assets/convert_png_to_rgb565.py \
            --unity-root ../unity-source \
            --asset-report asset-report.json \
            --output-dir assets

      - name: Generate C++ headers
        run: |
          cd firmware
          python tools/convert_assets/generate_cpp_headers.py \
            --assets-dir assets \
            --manifest-output assets/asset_manifest.json

      - name: Validate generated assets
        run: |
          cd firmware
          python -c "
import json
import os
import sys

# Load manifest
with open('assets/asset_manifest.json', 'r') as f:
    manifest = json.load(f)

# Validate structure
required_keys = ['source', 'sprite_name', 'character', 'animation', 'x', 'y', 'width', 'height', 'pivot', 'frame_index', 'output_file', 'output_symbol']
errors = []

for i, entry in enumerate(manifest):
    for key in required_keys:
        if key not in entry:
            errors.append(f'Entry {i}: missing key \"{key}\"')
    
    # Check output file exists
    if 'output_file' in entry and not os.path.exists(entry['output_file']):
        errors.append(f'Entry {i}: output file not found: {entry[\"output_file\"]}')

if errors:
    print('VALIDATION ERRORS:')
    for err in errors:
        print(f'  - {err}')
    sys.exit(1)

print(f'Validation passed: {len(manifest)} assets in manifest')
print(f'Assets directory structure:')
for root, dirs, files in os.walk('assets'):
    level = root.replace('assets', '').count(os.sep)
    indent = ' ' * 2 * level
    print(f'{indent}{os.path.basename(root)}/')
    subindent = ' ' * 2 * (level + 1)
    for file in files[:10]:  # Limit output
        print(f'{subindent}{file}')
"

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: firmware
          commit_message: 'Add converted Unity assets (Milestone 2)

- Convert characters.png and animations.png from Unity
- Extract real sprite rects from .meta files
- Generate RGB565 C++ headers
- Generate asset_manifest.json and asset-report.json

Generated by GitHub Actions workflow'
          file_pattern: 'assets/* tools/convert_assets/* docs/*'
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-assets
          path: |
            firmware/assets/
            firmware/asset-report.json
            firmware/assets/asset_manifest.json
          retention-days: 30
